<h1>Flujo · coordinados tela + rib desde el buffer</h1>
<div class="lg"><span style="--c:#4a73c9">Agencia y pedidos</span><span style="--c:#d98a3d">Tejeduría</span><span style="--c:#3f9a6a">Buffer crudo y asignación</span><span style="--c:#7a4fb0">Tintorería</span><span style="--c:#c0455a">Rechazo de calidad</span><span style="--c:#1f3c6e">CEDI y cliente</span></div>
<div class="wrap"><svg viewBox="0 80 1560 850" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flujo de coordinados tela más rib desde el buffer"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a44"/></marker></defs><text x="40" y="98" font-size="11" letter-spacing="1.4" font-weight="700" fill="#7a869c">1 · REPOSICIÓN DEL BUFFER (PEDIDO 05)</text><rect x="40" y="115" width="250" height="100" rx="10" fill="#e8f0fc" stroke="#4a73c9" stroke-width="2"/><text x="165.0" y="161.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Agencia planifica</text><text x="165.0" y="179.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">tela + rib como grupo</text><rect x="350" y="115" width="250" height="100" rx="10" fill="#e8f0fc" stroke="#4a73c9" stroke-width="2"/><text x="475.0" y="153.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Pedido 05 al buffer crudo</text><text x="475.0" y="171.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">base tela + rib</text><text x="475.0" y="187.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">MOQ base: barcada de 450 kg</text><rect x="417.6" y="103" width="190.4" height="22" rx="11" fill="#7b4fc1"/><text x="512.8000000000001" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Pendiente: barcada del rib</text><rect x="660" y="115" width="250" height="100" rx="10" fill="#fdf0e3" stroke="#d98a3d" stroke-width="2"/><text x="785.0" y="153.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Tejeduría teje con</text><text x="785.0" y="171.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">componentes homogéneos</text><text x="785.0" y="187.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Dibujo: COORD · 5% de complemento</text><text x="785.0" y="202.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Spandex ≤ 7%, si no: ensayos y OK escrito</text><rect x="970" y="115" width="250" height="100" rx="10" fill="#e6f4ec" stroke="#3f9a6a" stroke-width="2"/><text x="1095.0" y="153.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Buffer crudo: calidad</text><text x="1095.0" y="171.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">y almacén grupal</text><text x="1095.0" y="187.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Tela + rib en la misma ubicación</text><text x="1095.0" y="202.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Trazabilidad por HDR y pedido</text><path d="M290,165 L350,165" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><path d="M600,165 L660,165" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><path d="M910,165 L970,165" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><text x="40" y="300" font-size="11" letter-spacing="1.4" font-weight="700" fill="#7a869c">2 · DEMANDA DEL CEDI Y TINTORERÍA</text><rect x="40" y="320" width="250" height="100" rx="10" fill="#e8f0fc" stroke="#4a73c9" stroke-width="2"/><text x="165.0" y="358.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Agencia lanza pedido 41</text><text x="165.0" y="376.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">marcado NO TEJER</text><text x="165.0" y="392.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">No llega a tejeduría: es demanda</text><text x="165.0" y="407.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">calificada del buffer crudo</text><rect x="350" y="320" width="250" height="100" rx="10" fill="#e6f4ec" stroke="#3f9a6a" stroke-width="2"/><text x="475.0" y="358.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Asignación desde el buffer</text><text x="475.0" y="376.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">tela + rib al mismo tiempo</text><text x="475.0" y="392.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Dos OT: una de tela y una de rib</text><text x="475.0" y="407.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Se lanzan, se grapan y viajan juntas</text><rect x="660" y="320" width="250" height="100" rx="10" fill="#e6f4ec" stroke="#3f9a6a" stroke-width="2"/><text x="785.0" y="358.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Control físico del líder</text><text x="785.0" y="376.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">de turno al alistar</text><text x="785.0" y="392.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Valida que la tanda sea el rib asignado</text><text x="785.0" y="407.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Ubicación exclusiva de ribs en el WMS</text><rect x="970" y="320" width="250" height="100" rx="10" fill="#f0e8f8" stroke="#7a4fb0" stroke-width="2"/><text x="1095.0" y="358.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Tintorería recibe las OT</text><text x="1095.0" y="376.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">grapadas (tela + rib)</text><text x="1095.0" y="392.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Lote de trazabilidad: la OT (partida)</text><text x="1095.0" y="407.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Chequeo de calidad por pareja de OT</text><rect x="1063.2" y="308" width="164.8" height="22" rx="11" fill="#7b4fc1"/><text x="1145.6000000000001" y="323" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Pendiente: excepciones</text><path d="M290,370 L350,370" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><path d="M600,370 L660,370" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><path d="M910,370 L970,370" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><path d="M1095,215 L1095,258 L362,258 L362,320" fill="none" stroke="#3f9a6a" stroke-width="2" marker-end="url(#ah)"/><text x="560" y="250" font-size="13" font-weight="700" fill="#3f9a6a">stock disponible en el buffer</text><text x="40" y="515" font-size="11" letter-spacing="1.4" font-weight="700" fill="#7a869c">3 · CALIDAD Y ENTREGA</text><path d="M1095,420 L1095,540" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><polygon points="1095,540.0 1230.0,615 1095,690.0 960.0,615" fill="#fff" stroke="#1b2a44" stroke-width="2"/><text x="1095" y="611" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2a44">¿Cumple el estándar</text><text x="1095" y="629" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2a44">de tono y matizado?</text><rect x="1148" y="505" width="190" height="22" rx="11" fill="#7b4fc1"/><text x="1243" y="520" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Pendiente: definir estándar (CMC)</text><rect x="660" y="565" width="250" height="100" rx="10" fill="#1f3c6e" stroke="#1f3c6e" stroke-width="2"/><text x="785.0" y="603.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">CEDI recibe tela y rib juntos</text><text x="785.0" y="621.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">y asigna lotes homogéneos</text><text x="785.0" y="637.0" text-anchor="middle" font-size="12" font-style="italic" fill="#dbe5f7">A pedidos de clientes, con la</text><text x="785.0" y="652.0" text-anchor="middle" font-size="12" font-style="italic" fill="#dbe5f7">trazabilidad completa de planta</text><path d="M960,615 L910,615" fill="none" stroke="#2d8a5a" stroke-width="2" marker-end="url(#ah)"/><text x="928" y="605" font-size="13" font-weight="700" fill="#2d8a5a">Sí</text><rect x="350" y="565" width="250" height="100" rx="10" fill="#1f3c6e" stroke="#1f3c6e" stroke-width="2"/><text x="475.0" y="611.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Entrega a</text><text x="475.0" y="629.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">cliente final</text><path d="M660,615 L600,615" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><rect x="1290" y="565" width="250" height="100" rx="10" fill="#fbe9ea" stroke="#c0455a" stroke-width="2"/><text x="1415.0" y="603.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Se notifica a todos los</text><text x="1415.0" y="621.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">responsables de la cadena</text><text x="1415.0" y="637.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">El lote rechazado se reasigna</text><text x="1415.0" y="652.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">a otros destinatarios</text><path d="M1230,615 L1290,615" fill="none" stroke="#c0455a" stroke-width="2" marker-end="url(#ah)"/><text x="1248" y="605" font-size="13" font-weight="700" fill="#c0455a">No</text><path d="M1415,565 L1415,258 L1095,258" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><text x="1250" y="250" font-size="12" font-weight="600" fill="#c0455a">vuelve a asignación</text><rect x="40" y="715" width="1480" height="185" rx="12" fill="#f5f8fd" stroke="#cdd8ea"/><text x="64" y="745" font-size="14" font-weight="700" fill="#1f3c6e">Pendientes por cerrar y decisiones tomadas</text><circle cx="70" cy="771" r="5" fill="#7b4fc1"/><text x="84" y="775" font-size="13" fill="#1b2a44"><tspan font-weight="700">Horus Alvarado:</tspan> Definir las excepciones en tintorería</text><circle cx="800" cy="771" r="5" fill="#7b4fc1"/><text x="814" y="775" font-size="13" fill="#1b2a44"><tspan font-weight="700">Agencia:</tspan> Definir la barcada del rib (la base es de 450 kg)</text><circle cx="70" cy="811" r="5" fill="#7b4fc1"/><text x="84" y="815" font-size="13" fill="#1b2a44"><tspan font-weight="700">Calidad:</tspan> Definir el estándar de tono o matizado y el método de evaluación de coordinados</text><circle cx="70" cy="851" r="5" fill="#2d8a5a"/><text x="84" y="855" font-size="13" fill="#1b2a44"><tspan font-weight="700">Definido (Brayan, 2026-11-11):</tspan> el ERP no permite lanzar OT agrupada. Tela y rib llevan OT distintas, se lanzan, se grapan y viajan juntas</text><text x="64" y="888" font-size="11.5" fill="#6a7790">Fuente: «PROPUESTA COORDINADOS MTS» (Luis Silva, 2026-11-04) y revisión logística de Héctor Bermúdez (2026-11-05). Ajuste del 2026-11-11 (Brayan): OT separadas. Falta incorporar lo decidido con Alain el 2026-11-10.</text></svg></div>
