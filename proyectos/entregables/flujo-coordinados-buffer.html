<h1>Flujo · coordinados tela + rib desde el buffer</h1>
<div class="lg"><span style="--c:#4a73c9">Agencia y pedidos</span><span style="--c:#d98a3d">Tejeduría</span><span style="--c:#3f9a6a">Buffer crudo y asignación</span><span style="--c:#7a4fb0">Tintorería</span><span style="--c:#c0455a">Rechazo de calidad</span><span style="--c:#1f3c6e">CEDI y cliente</span></div>
<div class="wrap"><svg viewBox="0 80 1560 1090" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flujo de coordinados tela más rib desde el buffer"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a44"/></marker></defs><text x="40" y="98" font-size="11" letter-spacing="1.4" font-weight="700" fill="#7a869c">1 · REPOSICIÓN DEL BUFFER (PEDIDO 05)</text><rect x="40" y="115" width="250" height="100" rx="10" fill="#e8f0fc" stroke="#4a73c9" stroke-width="2"/><text x="165.0" y="161.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Agencia planifica</text><text x="165.0" y="179.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">tela + rib como grupo</text><rect x="350" y="115" width="250" height="100" rx="10" fill="#e8f0fc" stroke="#4a73c9" stroke-width="2"/><text x="475.0" y="153.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Pedido 05 al buffer crudo</text><text x="475.0" y="171.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">base tela + rib</text><text x="475.0" y="187.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">MOQ base: barcada de 450 kg</text><rect x="417.6" y="103" width="190.4" height="22" rx="11" fill="#7b4fc1"/><text x="512.8000000000001" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Pendiente: barcada del rib</text><rect x="660" y="115" width="250" height="100" rx="10" fill="#fdf0e3" stroke="#d98a3d" stroke-width="2"/><text x="785.0" y="153.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Tejeduría teje con</text><text x="785.0" y="171.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">componentes homogéneos</text><text x="785.0" y="187.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Dibujo: COORD · 5% de complemento</text><text x="785.0" y="202.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Spandex ≤ 7%, si no: ensayos y OK escrito</text><rect x="970" y="115" width="250" height="100" rx="10" fill="#e6f4ec" stroke="#3f9a6a" stroke-width="2"/><text x="1095.0" y="153.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Buffer crudo: calidad</text><text x="1095.0" y="171.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">y almacén grupal</text><text x="1095.0" y="187.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Tela + rib en la misma ubicación</text><text x="1095.0" y="202.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Trazabilidad por HDR y pedido</text><path d="M290,165 L350,165" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><path d="M600,165 L660,165" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><path d="M910,165 L970,165" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><text x="40" y="300" font-size="11" letter-spacing="1.4" font-weight="700" fill="#7a869c">2 · DEMANDA DEL CEDI Y TINTORERÍA</text><rect x="40" y="320" width="250" height="100" rx="10" fill="#e8f0fc" stroke="#4a73c9" stroke-width="2"/><text x="165.0" y="358.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Agencia lanza pedido 41</text><text x="165.0" y="376.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">marcado NO TEJER</text><text x="165.0" y="392.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">No llega a tejeduría: es demanda</text><text x="165.0" y="407.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">calificada del buffer crudo</text><rect x="350" y="320" width="250" height="100" rx="10" fill="#e6f4ec" stroke="#3f9a6a" stroke-width="2"/><text x="475.0" y="358.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Asignación desde el buffer</text><text x="475.0" y="376.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">tela + rib al mismo tiempo</text><text x="475.0" y="392.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Dos OT: una de tela y una de rib</text><text x="475.0" y="407.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Se lanzan, se grapan y viajan juntas</text><rect x="660" y="320" width="250" height="100" rx="10" fill="#e6f4ec" stroke="#3f9a6a" stroke-width="2"/><text x="785.0" y="358.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Control físico del líder</text><text x="785.0" y="376.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">de turno al alistar</text><text x="785.0" y="392.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Valida que la tanda sea el rib asignado</text><text x="785.0" y="407.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Ubicación exclusiva de ribs en el WMS</text><rect x="970" y="320" width="250" height="100" rx="10" fill="#f0e8f8" stroke="#7a4fb0" stroke-width="2"/><text x="1095.0" y="358.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Tintorería recibe las OT</text><text x="1095.0" y="376.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">grapadas (tela + rib)</text><text x="1095.0" y="392.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Lote de trazabilidad: la OT (partida)</text><text x="1095.0" y="407.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Los tipos de baño se definen abajo</text><rect x="1063.2" y="308" width="164.8" height="22" rx="11" fill="#7b4fc1"/><text x="1145.6000000000001" y="323" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Pendiente: excepciones</text><path d="M290,370 L350,370" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><path d="M600,370 L660,370" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><path d="M910,370 L970,370" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><path d="M1095,215 L1095,258 L362,258 L362,320" fill="none" stroke="#3f9a6a" stroke-width="2" marker-end="url(#ah)"/><text x="560" y="250" font-size="13" font-weight="700" fill="#3f9a6a">stock disponible en el buffer</text><text x="650" y="440" font-size="11" letter-spacing="1.4" font-weight="700" fill="#7a869c">TIPO DE BAÑO EN TINTORERÍA</text><path d="M1095,420 L1095,445" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><polygon points="1095,445.0 1235.0,500 1095,555.0 955.0,500" fill="#fff" stroke="#1b2a44" stroke-width="2"/><text x="1095" y="496" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2a44">¿Baño grupal</text><text x="1095" y="514" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2a44">o individual?</text><rect x="650" y="450" width="250" height="100" rx="10" fill="#f0e8f8" stroke="#7a4fb0" stroke-width="2"/><text x="775.0" y="497.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Baño grupal</text><text x="775.0" y="513.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Se evalúa el tono en conjunto</text><path d="M955,500 L900,500" fill="none" stroke="#7a4fb0" stroke-width="2" marker-end="url(#ah)"/><text x="912" y="490" font-size="13" font-weight="700" fill="#7a4fb0">Grupal</text><rect x="1270" y="450" width="230" height="100" rx="10" fill="#f0e8f8" stroke="#7a4fb0" stroke-width="2"/><text x="1385.0" y="497.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Baño individual</text><text x="1385.0" y="513.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">Se garantiza el matizado</text><path d="M1235,500 L1270,500" fill="none" stroke="#7a4fb0" stroke-width="2" marker-end="url(#ah)"/><text x="1228" y="490" font-size="13" font-weight="700" fill="#7a4fb0">Individual</text><text x="40" y="705" font-size="11" letter-spacing="1.4" font-weight="700" fill="#7a869c">3 · CALIDAD Y ENTREGA</text><path d="M775,550 L775,640 L1095,640 L1095,730" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><path d="M1385,550 L1385,640 L1095,640 L1095,730" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><polygon points="1095,730.0 1230.0,805 1095,880.0 960.0,805" fill="#fff" stroke="#1b2a44" stroke-width="2"/><text x="1095" y="801" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2a44">¿Cumple el estándar</text><text x="1095" y="819" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2a44">de tono y matizado?</text><rect x="1148" y="695" width="190" height="22" rx="11" fill="#7b4fc1"/><text x="1243" y="710" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Pendiente: definir estándar (CMC)</text><rect x="660" y="755" width="250" height="100" rx="10" fill="#1f3c6e" stroke="#1f3c6e" stroke-width="2"/><text x="785.0" y="793.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">CEDI recibe tela y rib juntos</text><text x="785.0" y="811.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">y asigna lotes homogéneos</text><text x="785.0" y="827.0" text-anchor="middle" font-size="12" font-style="italic" fill="#dbe5f7">A pedidos de clientes, con la</text><text x="785.0" y="842.0" text-anchor="middle" font-size="12" font-style="italic" fill="#dbe5f7">trazabilidad completa de planta</text><path d="M960,805 L910,805" fill="none" stroke="#2d8a5a" stroke-width="2" marker-end="url(#ah)"/><text x="928" y="795" font-size="13" font-weight="700" fill="#2d8a5a">Sí</text><rect x="350" y="755" width="250" height="100" rx="10" fill="#1f3c6e" stroke="#1f3c6e" stroke-width="2"/><text x="475.0" y="801.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Entrega a</text><text x="475.0" y="819.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">cliente final</text><path d="M660,805 L600,805" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><rect x="1290" y="755" width="250" height="100" rx="10" fill="#fbe9ea" stroke="#c0455a" stroke-width="2"/><text x="1415.0" y="793.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">Se notifica a todos los</text><text x="1415.0" y="811.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a44">responsables de la cadena</text><text x="1415.0" y="827.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">El lote rechazado se reasigna</text><text x="1415.0" y="842.0" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a85">a otros destinatarios</text><path d="M1230,805 L1290,805" fill="none" stroke="#c0455a" stroke-width="2" marker-end="url(#ah)"/><text x="1248" y="795" font-size="13" font-weight="700" fill="#c0455a">No</text><path d="M1520,755 L1520,258 L1095,258" fill="none" stroke="#1b2a44" stroke-width="2" marker-end="url(#ah)"/><text x="1250" y="250" font-size="12" font-weight="600" fill="#c0455a">vuelve a asignación</text><rect x="40" y="450" width="560" height="170" rx="12" fill="#f5f8fd" stroke="#cdd8ea"/><text x="60" y="480" font-size="14" font-weight="700" fill="#1f3c6e">Telas seleccionadas que comparten rib (9)</text><rect x="60" y="498" width="81.6" height="26" rx="13" fill="#e8f0fc" stroke="#9fb7e6"/><text x="100.8" y="515" text-anchor="middle" font-size="12.5" fill="#1f3c6e">Jeffreys</text><rect x="149.6" y="498" width="74.4" height="26" rx="13" fill="#e8f0fc" stroke="#9fb7e6"/><text x="186.8" y="515" text-anchor="middle" font-size="12.5" fill="#1f3c6e">Castela</text><rect x="232.0" y="498" width="117.60000000000001" height="26" rx="13" fill="#e8f0fc" stroke="#9fb7e6"/><text x="290.8" y="515" text-anchor="middle" font-size="12.5" fill="#1f3c6e">Rosley Percha</text><rect x="357.6" y="498" width="81.6" height="26" rx="13" fill="#e8f0fc" stroke="#9fb7e6"/><text x="398.40000000000003" y="515" text-anchor="middle" font-size="12.5" fill="#1f3c6e">Brunella</text><rect x="447.20000000000005" y="498" width="124.8" height="26" rx="13" fill="#e8f0fc" stroke="#9fb7e6"/><text x="509.6" y="515" text-anchor="middle" font-size="12.5" fill="#1f3c6e">Santoro Percha</text><rect x="60" y="532" width="81.6" height="26" rx="13" fill="#e8f0fc" stroke="#9fb7e6"/><text x="100.8" y="549" text-anchor="middle" font-size="12.5" fill="#1f3c6e">Ferreira</text><rect x="149.6" y="532" width="132.0" height="26" rx="13" fill="#e8f0fc" stroke="#9fb7e6"/><text x="215.6" y="549" text-anchor="middle" font-size="12.5" fill="#1f3c6e">Ferreira Percha</text><rect x="289.6" y="532" width="74.4" height="26" rx="13" fill="#e8f0fc" stroke="#9fb7e6"/><text x="326.8" y="549" text-anchor="middle" font-size="12.5" fill="#1f3c6e">Bosforo</text><rect x="372.0" y="532" width="81.6" height="26" rx="13" fill="#e8f0fc" stroke="#9fb7e6"/><text x="412.8" y="549" text-anchor="middle" font-size="12.5" fill="#1f3c6e">Brazilia</text><text x="60" y="608" font-size="11.5" fill="#6a7790">Selección de Brayan, 2026-11-11. Comparten el mismo rib.</text><rect x="40" y="905" width="1480" height="235" rx="12" fill="#f5f8fd" stroke="#cdd8ea"/><text x="64" y="935" font-size="14" font-weight="700" fill="#1f3c6e">Pendientes por cerrar y decisiones tomadas</text><circle cx="70" cy="961" r="5" fill="#7b4fc1"/><text x="84" y="965" font-size="13" fill="#1b2a44"><tspan font-weight="700">Horus Alvarado:</tspan> Definir las excepciones en tintorería</text><circle cx="800" cy="961" r="5" fill="#7b4fc1"/><text x="814" y="965" font-size="13" fill="#1b2a44"><tspan font-weight="700">Agencia:</tspan> Definir la barcada del rib (la base es de 450 kg)</text><circle cx="70" cy="1001" r="5" fill="#7b4fc1"/><text x="84" y="1005" font-size="13" fill="#1b2a44"><tspan font-weight="700">Calidad:</tspan> Definir el estándar de tono (baño grupal) y de matizado (baño individual) y el
